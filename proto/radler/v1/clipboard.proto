syntax = "proto3";

package radler.v1;

service ClipboardService {
  rpc Copy(stream CopyRequest) returns (CopyResponse);
  rpc Paste(PasteRequest) returns (stream PasteResponse);
}

message CopyRequest {
  bytes data = 1;
}

message CopyResponse {}

message PasteRequest {}

message PasteResponse {
  bytes data = 1;
}
